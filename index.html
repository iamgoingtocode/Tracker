function historyPane(hist, bare){
  if(!hist.length) return (bare?'':'<div class="card">')+'<div class="empty"><div class="big">⛁</div>No history for this record yet.</div>'+(bare?'':'</div>');
  const verb = {create:'Added', update:'Changed', delete:'Deleted'};
  const inner = '<div class="hist">'+hist.map(h=>{
    const restorable = canEdit() && h.entity!=='global';
    return '<div class="hist-i" data-a="'+esc(h.action)+'">'+
      '<div class="spread"><div class="grow">'+
        '<b>'+esc(verb[h.action]||h.action)+'</b> '+
        '<span class="badge">'+esc(entityWord(h.entity))+'</span> '+
        esc(h.label || (h.after&&h.after.name) || (h.before&&h.before.name) || '')+
        '<div class="tiny dim" style="margin-top:3px">'+fmtTS(h.ts)+' · '+relTime(h.ts)+'</div>'+
      '</div>'+
      (restorable?'<button class="btn btn-ghost btn-sm" data-act="restore-hist" data-id="'+h.id+'">↶ Undo</button>':'')+
      '</div></div>';
  }).join('')+'</div>';
  return bare ? inner : '<div class="card card-pad">'+inner+'</div>';
}
function entityWord(e){
  return {profile:'profile', b2b:'partnership', partner:'partner', meeting:'meeting note',
          item:'open item', global:'dropdown list', bulk:'bulk'}[e] || e;
}

function itemForm(type, parentId, rec){
  const g = V().globals, isNew = !rec;
  const fixed = !!(type && parentId);
  const targets = [];
  if(!fixed){
    V().profiles.forEach(p=>{
      profB2b(p.id).forEach(b=>targets.push({value:'b2b:'+b.id, label:p.name+' › 🏢 '+b.name}));
      profPart(p.id).forEach(pt=>targets.push({value:'partner:'+pt.id, label:p.name+' › 🤝 '+pt.name}));
    });
  }
  const fields = [];
  if(!fixed){
    fields.push({name:'target', label:'Against which record', type:'select', required:true,
      options: targets.map(t=>t.label), value: rec ? labelForTarget(rec) : '',
      help: targets.length ? '' : 'Create a partnership or partner first.'});
  }
  fields.push(
    {name:'title', label:'Item', required:true, value:rec&&rec.title, placeholder:'e.g. Send signed MoU to their legal team'},
    {name:'owner', label:'Owner', half:true, value:rec&&rec.owner, placeholder:'Who is doing it'},
    {name:'due', label:'Due date', type:'date', half:true, value:rec&&rec.due},
    {name:'priority', label:'Priority', type:'select', options:g.priorities, value:(rec&&rec.priority)||'Medium', half:true, global:'priorities'},
    {name:'status', label:'Status', type:'select', options:g.itemStatuses, value:(rec&&rec.status)||'Open', half:true, required:true, global:'itemStatuses'},
    {name:'notes', label:'Notes', type:'textarea', rows:3, value:rec&&rec.notes}
  );

  openForm({
    title: isNew ? 'New open item' : 'Edit open item',
    submitLabel: isNew ? 'Add item' : 'Save changes',
    fields,
    onSubmit(v){
      let t = type, pid2 = parentId, prof = null;
      if(!fixed){
        const hit = targets.find(x=>x.label===v.target);
        if(!hit){ toast('Pick a record.', true); return; }
        const [tt, ii] = hit.value.split(':'); t = tt; pid2 = ii;
      }
      const par = entity(t, pid2); prof = par ? par.profileId : null;
      delete v.target;
      if(isNew){
        const r = Object.assign({id:uid(), parentType:t, parentId:pid2, profileId:prof,
                                 createdAt:Date.now(), updatedAt:Date.now()}, v);
        if(r.status==='Done') r.closedAt = Date.now();
        V().openItems.push(r);
        commit('create','item',r.id,null,r,r.title);
        toast('Open item added.');
      } else {
        const before = clone(rec);
        Object.assign(rec, v, {parentType:t, parentId:pid2, profileId:prof, updatedAt:Date.now()});
        rec.closedAt = rec.status==='Done' ? (rec.closedAt || Date.now()) : null;
        commit('update','item',rec.id,before,clone(rec),rec.title);
        toast('Open item updated.');
      }
      render();
    }
  });
}
function labelForTarget(item){
  const p = profile(item.profileId), e = entity(item.parentType, item.parentId);
  if(!e) return '';
  return (p?p.name:'?')+' › '+(item.parentType==='b2b'?'🏢 ':'🤝 ')+e.name;
}

async function delProfile(id){
  const p = profile(id); if(!p) return;
  const b = profB2b(id), pa = profPart(id);
  const ms = V().meetings.filter(m=>m.profileId===id);
  const it = V().openItems.filter(i=>i.profileId===id);
  const ok = await confirmDialog({
    title:'Delete profile?', danger:true, confirmLabel:'Delete everything',
    message:'<b>'+esc(p.name)+'</b> will be deleted along with:<br>'+
      '• '+b.length+' B2B partnership(s)<br>• '+pa.length+' partner(s)<br>'+
      '• '+ms.length+' meeting note(s)<br>• '+it.length+' open item(s)<br><br>'+
      'A full copy is kept in <b>Backups → Change history</b>, so you can undo this.',
    requireText: (b.length+pa.length+ms.length+it.length) > 0 ? 'DELETE' : null
  });
  if(!ok) return;
  const bundle = { profile:clone(p), b2b:clone(b), partners:clone(pa), meetings:clone(ms), openItems:clone(it) };
  const v = V();
  v.profiles = v.profiles.filter(x=>x.id!==id);
  v.b2b = v.b2b.filter(x=>x.profileId!==id);
  v.partners = v.partners.filter(x=>x.profileId!==id);
  v.meetings = v.meetings.filter(x=>x.profileId!==id);
  v.openItems = v.openItems.filter(x=>x.profileId!==id);
  commit('delete','profile',id,p,null,p.name,bundle);
  toast('Profile deleted — undo from Backups.');
  nav('/profiles'); render();
}

/* =====================================================================
   RESTORE FROM HISTORY
   ===================================================================== */
async function restoreHistory(hid){
  const v = V();
  const h = byId(v.history, hid); if(!h) return;
  const verb = {create:'remove the record that was added', update:'roll back to the previous version',
                delete:'bring the deleted record back'}[h.action];
  const ok = await confirmDialog({ title:'Undo this change?', confirmLabel:'Undo it',
    message:'This will <b>'+verb+'</b> for '+esc(entityWord(h.entity))+
      ' “'+esc(h.label||'')+'”, as it was on '+esc(fmtTS(h.ts))+'.' });
  if(!ok) return;

  const coll = { profile:'profiles', b2b:'b2b', partner:'partners', meeting:'meetings', item:'openItems' }[h.entity];
  if(!coll){ toast('That change cannot be undone automatically.', true); return; }

  if(h.action === 'create'){
    v[coll] = v[coll].filter(x=>x.id !== h.entityId);
  } else if(h.action === 'update'){
    const i = v[coll].findIndex(x=>x.id === h.entityId);
    if(i >= 0) v[coll][i] = clone(h.before); else v[coll].push(clone(h.before));
  } else if(h.action === 'delete'){
    if(!v[coll].some(x=>x.id===h.entityId)) v[coll].push(clone(h.before));
    if(h.bundle){
      const add = (arr, list) => (list||[]).forEach(r=>{ if(!arr.some(x=>x.id===r.id)) arr.push(clone(r)); });
      add(v.b2b, h.bundle.b2b); add(v.partners, h.bundle.partners);
      add(v.meetings, h.bundle.meetings); add(v.openItems, h.bundle.openItems);
    }
  }
  commit('update','bulk', h.entityId, null, null, 'Undid: '+(h.label||entityWord(h.entity)));

function download(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function stamp(){ return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19); }

function exportPayload(){
  return { app:'divinheal-tracker', kind:'backup', version:1,
           exportedAt: Date.now(), account: S.user, data: clone(S.vault) };
}
function exportJSON(){
  download('divinheal-tracker-'+stamp()+'.json', JSON.stringify(exportPayload(), null, 2), 'application/json');
  toast('JSON backup downloaded.');
}
function exportHTML(){
  const doc = document.documentElement.cloneNode(true);
  const app = doc.querySelector('#app'); if(app){ app.innerHTML=''; app.classList.add('hidden'); }
  const lk  = doc.querySelector('#lock'); if(lk){ lk.innerHTML=''; lk.classList.add('hidden'); }
  ['#modalRoot','#confirmRoot','#toastRoot'].forEach(s=>{ const n=doc.querySelector(s); if(n) n.innerHTML=''; });
  const old = doc.querySelector('#__DH_BACKUP__'); if(old) old.remove();

  const s = document.createElement('script');
  s.type = 'application/json'; s.id = '__DH_BACKUP__';
  s.textContent = JSON.stringify(exportPayload()).replace(/</g,'\\u003c');
  // MUST go in <head>: the app script is inline at the end of <body>, so anything
  // appended after it is not yet parsed when boot() looks for it.
  doc.querySelector('head').appendChild(s);

  download('divinheal-tracker-backup-'+stamp()+'.html', '<!DOCTYPE html>\n'+doc.outerHTML, 'text/html');
  toast('HTML backup downloaded — open it any time, no login needed.');
}

function parseBackup(text){
  const t = text.trim();
  if(t.startsWith('{')){
    const j = JSON.parse(t);
    if(j.data && j.data.profiles) return j;
    if(j.profiles) return { data:j, exportedAt:null };
    return null;
  }
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const el = doc.querySelector('#__DH_BACKUP__');
  if(!el) return null;
  const j = JSON.parse(el.textContent);
  return (j && j.data) ? j : null;
}

/* =====================================================================
   SESSION PERSISTENCE (so a new window inherits the unlock)
   ===================================================================== */
async function stashSession(){
  try{
    const jwk = await crypto.subtle.exportKey('jwk', S.key);
    sessionStorage.setItem(K_SESSION, JSON.stringify({user:S.user, jwk}));
  }catch(e){ /* non-fatal */ }
}
async function restoreSession(){
  const raw = sessionStorage.getItem(K_SESSION);
  if(!raw) return false;
  try{
    const {user, jwk} = JSON.parse(raw);
    if(!readAccounts()[user]) return false;
    const key = await crypto.subtle.importKey('jwk', jwk, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
    const blob = localStorage.getItem(K_VAULT(user));
    const vault = blob ? migrate(await decryptJSON(key, JSON.parse(blob))) : seedVault(user);
    S.user = user; S.key = key; S.vault = vault; S.savedAt = Date.now();
    await loadSyncConfig();
    return true;
  }catch(e){ sessionStorage.removeItem(K_SESSION); return false; }
}
function lockSession(){
  sessionStorage.removeItem(K_SESSION);
  clearTimeout(syncTimer);
  Object.assign(SY, {token:null, gistId:null, lastSeenAt:0, lastSyncAt:0, status:'off', error:null, pending:false});
  S.user = null; S.key = null; S.vault = null;
  $('#app').classList.add('hidden'); $('#app').innerHTML='';
  $('#lock').classList.remove('hidden');
  renderLock();
}

function wireSearch(){
  const inp = $('#gsearch'), out = $('#sres');
  if(!inp) return;
  const close = () => { out.innerHTML=''; };
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    if(q.length < 2){ close(); return; }
    const v = V(), hits = [];
    const add = (label, sub, href) => { if(hits.length < 25) hits.push({label, sub, href}); };
    v.profiles.forEach(p => { if(hay(p, ['name','role','org','notes','region']).includes(q))
      add(p.name, 'Profile · '+(p.role||''), '#/profile/'+p.id); });
    v.b2b.forEach(b => { if(hay(b, ['name','type','country','city','contactName','contactEmail','notes','org']).includes(q))
      add(b.name, '🏢 '+(b.type||'')+' · '+(b.country||''), '#/e/b2b/'+b.id); });
    v.partners.forEach(p => { if(hay(p, ['name','type','country','city','org','contactEmail','notes']).includes(q))
      add(p.name, '🤝 '+(p.type||'')+' · '+(p.country||''), '#/e/partner/'+p.id); });
    v.meetings.forEach(m => { if(hay(m, ['title','notes','attendees','decisions','next']).includes(q))
      add((m.title||'Meeting')+' — '+fmtDate(m.date), '🗓 '+entName(m.parentType,m.parentId), '#/e/'+m.parentType+'/'+m.parentId+'?tab=meetings'); });
    v.openItems.forEach(i => { if(hay(i, ['title','owner','notes']).includes(q))
      add(i.title, '✓ '+(i.status||'')+' · '+entName(i.parentType,i.parentId), '#/e/'+i.parentType+'/'+i.parentId+'?tab=items'); });

    out.innerHTML = hits.length
      ? '<div class="sresults">'+hits.map(h=>'<a href="'+h.href+'" data-sres><div class="namecell">'+esc(h.label)+
        '</div><div class="sub">'+esc(h.sub)+'</div></a>').join('')+'</div>'
      : '<div class="sresults"><div style="padding:14px" class="dim small">No matches.</div></div>';
  };
  inp.onkeydown = e => { if(e.key==='Escape'){ inp.value=''; close(); inp.blur(); } };
  out.addEventListener('click', e => { if(e.target.closest('[data-sres]')) { inp.value=''; close(); } });
}

function glistAdd(k){
  openForm({ title:'Add to '+globalLabel(k), submitLabel:'Add',
    fields:[{name:'val', label:'New entry', required:true, placeholder:'e.g. Cooperative society'}],
    onSubmit(v){
      const list = V().globals[k];
      if(list.some(x=>x.toLowerCase()===v.val.toLowerCase())){ toast('Already in the list.'); return; }
      list.push(v.val); list.sort((a,b)=>a.localeCompare(b));
      commit('update','global',k,null,{list:k, added:v.val},'Added "'+v.val+'" to '+globalLabel(k));
      toast('Added.'); render();
    }});
}
async function glistDel(k, val){
  const v = V();
  let used = 0;
  const check = (arr, field) => arr.forEach(r => {
    const f = r[field];
    if(Array.isArray(f)) { if(f.includes(val)) used++; }
    else if(f === val) used++;
  });
  if(k==='b2bTypes') check(v.b2b,'type');
  if(k==='partnerTypes') check(v.partners,'type');
  if(k==='countries'){ check(v.b2b,'country'); check(v.partners,'country'); }
  if(k==='stages'){ check(v.b2b,'stage'); check(v.partners,'stage'); }
  if(k==='institutions') check(v.partners,'institutions');
  if(k==='priorities') check(v.openItems,'priority');
  if(k==='itemStatuses') check(v.openItems,'status');

  const ok = await confirmDialog({ title:'Remove from dropdown?', danger:used>0, confirmLabel:'Remove',
    message:'“<b>'+esc(val)+'</b>” will disappear from the '+esc(globalLabel(k))+' dropdown.'+
      (used ? '<br><br><b>'+used+' existing record(s) still use it.</b> They keep the value — it just will not be offered for new entries.' : '') });
  if(!ok) return;
  v.globals[k] = v.globals[k].filter(x=>x!==val);
  commit('update','global',k,{list:k, removed:val},null,'Removed "'+val+'" from '+globalLabel(k));
  toast('Removed.'); render();
}

document.addEventListener('click', async e => {
  // nav-able stat cards
  const navCard = e.target.closest('[data-nav]');
  if(navCard && !e.target.closest('[data-act]')){ nav(navCard.dataset.nav); return; }

  // Open / Closed switch on the items page, keeping the other filters
  const iv = e.target.closest('[data-itemview]');
  if(iv){
    const {q} = parseRoute();
    if(iv.dataset.itemview === 'closed') q.set('view','closed'); else q.delete('view');
    q.delete('overdue'); q.delete('status');
    const qs = q.toString();
    nav('/items' + (qs ? '?'+qs : ''));
    return;
  }

  // in-page tab switching (preserves the rest of the route)
  const tab = e.target.closest('[data-tab]');
  if(tab){ nav(tab.dataset.base.replace('#','') + '?tab=' + tab.dataset.tab); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(S.readOnly && MUTATIONS.has(act)){ toast('This is a read-only backup copy.', true); return; }

  const id = el.dataset.id, t = el.dataset.t, pid = el.dataset.pid;

  switch(act){
    case 'theme': {
      const cur = document.documentElement.dataset.theme;
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try{ localStorage.setItem(K_THEME, next); }catch(_){}
      break;
    }
    case 'lock': lockSession(); break;

    case 'new-profile':  profileForm(null); break;
    case 'edit-profile': profileForm(profile(id)); break;
    case 'del-profile':  delProfile(id); break;

    case 'new-b2b':      b2bForm(pid, null); break;
    case 'edit-b2b':     { const r = entity('b2b', id); b2bForm(r.profileId, r); break; }
    case 'del-b2b':      delEntity('b2b', id); break;

    case 'new-partner':  partnerForm(pid, null); break;
    case 'edit-partner': { const r = entity('partner', id); partnerForm(r.profileId, r); break; }
    case 'del-partner':  delEntity('partner', id); break;

    case 'new-meeting':  meetingForm(t, id, null); break;
    case 'edit-meeting': { const m = byId(V().meetings, id); meetingForm(m.parentType, m.parentId, m); break; }
    case 'del-meeting':  delMeeting(id); break;

    case 'new-item':     itemForm(t, id, null); break;
    case 'new-item-any': itemForm(null, null, null); break;
    case 'edit-item':    { const i = byId(V().openItems, id); itemForm(null, null, i); break; }
    case 'del-item':     delItem(id); break;
    case 'toggle-item': {
      const i = byId(V().openItems, id); if(!i) break;
      if(i.status !== 'Done'){
        const ok = await confirmDialog({
          title:'Close this item?', confirmLabel:'Close it',
          message:'<b>'+esc(i.title)+'</b>'+
            (i.parentId?'<br><span style="opacity:.8">'+esc(entName(i.parentType,i.parentId))+'</span>':'')+
            '<br><br>It moves to the <b>Closed</b> tab, where you can reopen it any time.' });
        if(!ok){ render(); break; }   // put the tickbox back
      }
      const before = clone(i);
      i.status = (i.status === 'Done') ? 'Open' : 'Done';
      i.closedAt = i.status === 'Done' ? Date.now() : null;
      i.updatedAt = Date.now();
      commit('update','item',i.id,before,clone(i),i.title+' → '+i.status);
      toast(i.status === 'Done' ? 'Closed — find it under Closed.' : 'Reopened.');
      render();
      break;
    }
    case 'reopen-item': {
      const i = byId(V().openItems, id); if(!i) break;
      const before = clone(i);
      i.status = 'Open'; i.closedAt = null; i.updatedAt = Date.now();
      commit('update','item',i.id,before,clone(i),i.title+' → reopened');
      toast('Reopened.');
      render();
      break;
    }

    case 'open-win': {
      const url = location.origin + location.pathname + location.search + '#/e/' + t + '/' + id;
      window.open(url, 'dh_'+t+'_'+id, 'width=1150,height=860,noopener');
      break;
    }

    case 'export-html': exportHTML(); break;
    case 'export-json': case 'dl-json': exportJSON(); break;
    case 'import':      importDialog(); break;
    case 'snapshot-now': pushSnapshot('Manual snapshot'); save(true); toast('Snapshot taken.'); render(); break;
    case 'dl-snapshot': {
      const s = byId(V().snapshots, id);
      download('divinheal-snapshot-'+new Date(s.ts).toISOString().slice(0,10)+'.json',
               JSON.stringify({app:'divinheal-tracker', kind:'backup', version:1, exportedAt:s.ts,
                               data: Object.assign(JSON.parse(s.json), {history:[], snapshots:[], meta:{}})}, null, 2),
               'application/json');
      break;
    }
    case 'restore-snapshot': {
      const s = byId(V().snapshots, id);
      const ok = await confirmDialog({ title:'Restore this snapshot?', danger:true, confirmLabel:'Restore',
        message:'Everything will be rolled back to <b>'+esc(fmtTS(s.ts))+'</b>.<br><br>'+
          'A snapshot of the current state is taken first, so this is reversible.', requireText:'RESTORE' });
      if(!ok) break;
      pushSnapshot('Before restoring '+fmtTS(s.ts));
      const d = JSON.parse(s.json);
      Object.assign(V(), {globals:d.globals, profiles:d.profiles, b2b:d.b2b, partners:d.partners,
                          meetings:d.meetings, openItems:d.openItems});
      commit('update','bulk','snapshot','','','Restored snapshot from '+fmtTS(s.ts));
      toast('Snapshot restored.'); render();
      break;
    }
    case 'del-snapshot': {
      const s = byId(V().snapshots, id);
      const ok = await confirmDialog({ title:'Delete snapshot?', danger:true, confirmLabel:'Delete',
        message:'The snapshot from <b>'+esc(fmtTS(s.ts))+'</b> will be removed permanently.' });
      if(!ok) break;
      V().snapshots = V().snapshots.filter(x=>x.id!==id); save(); render();
      break;
    }
    case 'restore-hist': restoreHistory(id); break;

    case 'change-pw':      changePasswordDialog(); break;
    case 'wipe-data':      wipeData(); break;
    case 'delete-account': deleteAccount(); break;
    case 'edit-owner':
      openForm({ title:'Owner name', submitLabel:'Save',
        fields:[{name:'owner', label:'Your name', value:V().owner}],
        onSubmit(v){ V().owner = v.owner; save(); toast('Saved.'); render(); }});
      break;

    case 'glist-add': glistAdd(el.dataset.k); break;
    case 'glist-del': glistDel(el.dataset.k, el.dataset.v); break;

    case 'sync-connect':    syncConnectDialog(); break;
    case 'sync-disconnect': syncDisconnect(); break;
    case 'sync-now':        syncPush({force:true, announce:true}); break;
    case 'sync-pull':       syncPull({announce:true}); break;

    case 'clear-filters': nav('/items'); break;
  }
});

/* inline onboarding-checklist and rating edits (saved as you change them) */
document.addEventListener('change', e => {
  const ob = e.target.closest('[data-onboard]');
  const sc = e.target.closest('[data-score]');
  const el = ob || sc;
  if(!el) return;
  if(!canEdit()){ toast('This is a read-only backup copy.', true); return; }
  const rec = entity(el.dataset.t, el.dataset.id);
  if(!rec) return;
  const before = clone(rec);
  if(ob){
    rec.onboarding = Object.assign({}, rec.onboarding);
    rec.onboarding[ob.dataset.onboard] = ob.value;
  } else {
    rec.rating = Object.assign({}, rec.rating);
    rec.rating[sc.dataset.score] = sc.value ? Number(sc.value) : '';
  }
  rec.updatedAt = Date.now();
  commit('update', el.dataset.t, rec.id, before, clone(rec),
         rec.name + ' \u2014 ' + (ob ? 'checklist' : 'rating') + ' updated');
  paintScoring(el.dataset.t, el.dataset.id);
});

/* filters on the Open Items page */
document.addEventListener('change', e => {
  const f = e.target.closest('[data-filter]');
  if(!f) return;
  const {parts, q} = parseRoute();
  if(parts[0] !== 'items') return;
  const key = f.dataset.filter;
  const val = f.type === 'checkbox' ? (f.checked ? '1' : '') : f.value;
  if(val) q.set(key, val); else q.delete(key);
  const s = q.toString();
  nav('/items' + (s ? '?'+s : ''));
});
document.addEventListener('input', e => {
  const f = e.target.closest('[data-filter="owner"]');
  if(!f) return;
  clearTimeout(f._t);
  f._t = setTimeout(()=>{
    const {q} = parseRoute();
    if(f.value) q.set('owner', f.value); else q.delete('owner');
    const s = q.toString();
    nav('/items' + (s ? '?'+s : ''));
    setTimeout(()=>{ const n = $('[data-filter="owner"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }, 10);
  }, 320);
});

/* warn on close while a save is still pending */
window.addEventListener('beforeunload', e => {
  if(S.dirty && !S.readOnly){ e.preventDefault(); e.returnValue = ''; }
});

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  try{ const th = localStorage.getItem(K_THEME); if(th) document.documentElement.dataset.theme = th; }catch(_){}

  const embedded = document.getElementById('__DH_BACKUP__');
  if(embedded){
    try{
      const payload = JSON.parse(embedded.textContent);
      S.vault = migrate(payload.data);
      S.vault.__exportedAt = payload.exportedAt;
      S.user = payload.account || 'backup';
      S.readOnly = true;
      $('#lock').classList.add('hidden');
      $('#app').classList.remove('hidden');
      if(!location.hash || location.hash === '#') location.hash = '#/dash';
      render();
      return;
    }catch(e){
      document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif">This backup file is corrupted: '+esc(e.message)+'</div>';
      return;
    }
  }

  if(!crypto || !crypto.subtle){
    $('#lock').innerHTML = '<div class="lockcard"><div class="warnbox"><b>This browser cannot encrypt data.</b><br>'+
      'The tracker needs the Web Crypto API, which requires <b>https://</b> or <b>localhost</b>. '+
      'If you opened this file directly from disk, host it on GitHub Pages instead.</div></div>';
    return;
  }

  if(await restoreSession()){
    $('#lock').classList.add('hidden');
    $('#app').classList.remove('hidden');
    if(!location.hash || location.hash === '#') location.hash = '#/dash';
    render();
    syncPull();
  } else {
    lockMode = Object.keys(readAccounts()).length ? 'signin' : 'create';
    renderLock();
  }
})();
</script>
</body>
