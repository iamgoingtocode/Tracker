<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Divinheal Partnership Tracker</title>
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f0f2f5;
  --text:#14171c; --text-2:#525a66; --text-3:#7b8494;
  --border:#e2e6eb; --border-2:#ccd2da;
  --accent:#1f6feb; --accent-fg:#ffffff; --accent-soft:#e8f0fe; --accent-strong:#1a5fc9;
  --danger:#c92a2a; --danger-soft:#fdecec; --danger-strong:#a91f1f;
  --ok:#137a44; --ok-soft:#e5f5ec;
  --warn:#9a6700; --warn-soft:#fdf4e0;
  --purple:#6b3fa0; --purple-soft:#f0eaf8;
  --shadow:0 1px 2px rgba(16,22,32,.06), 0 4px 14px rgba(16,22,32,.06);
  --shadow-lg:0 10px 40px rgba(16,22,32,.18);
  --r:10px; --r-sm:7px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1b212a; --surface-3:#222a35;
  --text:#e6edf3; --text-2:#a6b1c0; --text-3:#7d8998;
  --border:#2a323d; --border-2:#3a4451;
  --accent:#4c8dff; --accent-fg:#06101f; --accent-soft:#182740; --accent-strong:#6aa1ff;
  --danger:#ff6b6b; --danger-soft:#3a1c1e; --danger-strong:#ff8888;
  --ok:#3ddc97; --ok-soft:#123027;
  --warn:#e0a83a; --warn-soft:#332814;
  --purple:#b18ae0; --purple-soft:#271e38;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:20px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
.muted{color:var(--text-2)} .dim{color:var(--text-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-family:var(--mono)}
.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================= BUTTONS ============================= */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-sm);
  border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer;
  font-size:13px;font-weight:540;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--text-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-strong);border-color:var(--danger-strong)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);border-color:transparent;color:var(--text)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn-icon{padding:5px 7px;font-size:13px;line-height:1}
.btn-block{width:100%;justify-content:center}

/* ============================= LOCK SCREEN ============================= */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 500px at 50% -15%, var(--accent-soft), var(--bg) 62%)}
.lockcard{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow-lg);padding:30px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-size:19px;flex:none}
.lock-tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:9px;margin:20px 0 18px}
.lock-tabs button{flex:1;padding:7px;border:0;background:transparent;border-radius:6px;cursor:pointer;
  font-size:13px;font-weight:560;color:var(--text-2)}
.lock-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ============================= SHELL ============================= */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 16px;height:54px}
.topbar .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-size:15px;flex:none}
.brandname{font-weight:680;letter-spacing:-.02em;font-size:14.5px}
.searchwrap{position:relative;flex:1;max-width:400px}
.searchwrap input{width:100%;padding:7px 11px;border:1px solid var(--border-2);border-radius:8px;
  background:var(--surface-2);font-size:13px}
.searchwrap input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.sresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:380px;
  overflow:auto;z-index:60}
.sresults a{display:block;padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.sresults a:last-child{border-bottom:0}
.sresults a:hover{background:var(--accent-soft)}
.savepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);
  padding:5px 10px;border-radius:99px;background:var(--surface-3);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
.dot.busy{background:var(--warn)}
.dot.err{background:var(--danger)}

.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 54px)}
.sidebar{width:214px;flex:none;padding:14px 10px;position:sticky;top:54px;
  height:calc(100vh - 54px);overflow:auto;border-right:1px solid var(--border);background:var(--surface)}
.navlink{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text-2);
  font-weight:540;font-size:13.5px;margin-bottom:2px;cursor:pointer;text-decoration:none}
.navlink:hover{background:var(--surface-3);color:var(--text);text-decoration:none}
.navlink.on{background:var(--accent-soft);color:var(--accent);font-weight:620}
.navlink .ic{width:18px;text-align:center;flex:none}
.navlink .cnt{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--text-2);
  padding:1px 7px;border-radius:99px;font-weight:600}
.navlink.on .cnt{background:var(--accent);color:var(--accent-fg)}
.navlink .cnt.hot{background:var(--danger);color:#fff}
.navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);
  font-weight:700;padding:14px 10px 6px}
.content{flex:1;min-width:0;padding:22px 26px 80px}
.page-head{margin-bottom:18px}
.crumb{font-size:12.5px;color:var(--text-3);margin-bottom:5px}
.crumb a{color:var(--text-2)}

/* ============================= CARDS & TABLES ============================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;
  align-items:center;justify-content:space-between;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:700}
.stat .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.stat .s{font-size:11.5px;color:var(--text-2);margin-top:3px}
.stat.hot .v{color:var(--danger)}
.stat.warn .v{color:var(--warn)}
.stat.good .v{color:var(--ok)}
.stat.link{cursor:pointer}
.stat.link:hover{border-color:var(--accent)}

.tablewrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:9px 13px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-3);font-weight:700;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
table.tbl td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.acts{text-align:right;white-space:nowrap;width:1%}
.namecell{font-weight:600}
.sub{font-size:11.5px;color:var(--text-3);margin-top:2px}

.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:640;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge.b-blue{background:var(--accent-soft);color:var(--accent)}
.badge.b-green{background:var(--ok-soft);color:var(--ok)}
.badge.b-red{background:var(--danger-soft);color:var(--danger)}
.badge.b-amber{background:var(--warn-soft);color:var(--warn)}
.badge.b-purple{background:var(--purple-soft);color:var(--purple)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;background:var(--surface-3);
  color:var(--text-2);border:1px solid var(--border)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 15px;border:0;background:transparent;cursor:pointer;font-size:13.5px;font-weight:560;
  color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:640}
.tab .cnt{font-size:11px;background:var(--surface-3);padding:1px 7px;border-radius:99px;font-weight:600}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}

.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty .big{font-size:32px;margin-bottom:10px;opacity:.55}

.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:9px 18px;font-size:13.5px}
.kv dt{color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:2px}
.kv dd{margin:0}
.notebox{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13px;line-height:1.6}

.meeting{border:1px solid var(--border);border-radius:var(--r);padding:0;margin-bottom:12px;background:var(--surface);overflow:hidden}
.meeting-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  padding:12px 15px;background:var(--surface-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.meeting-b{padding:14px 15px;display:grid;gap:13px}
.mfield .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:700;margin-bottom:4px}
.datechip{font-family:var(--mono);font-size:12px;font-weight:650;background:var(--accent-soft);color:var(--accent);
  padding:3px 9px;border-radius:6px;white-space:nowrap}

.hist{border-left:2px solid var(--border);padding-left:16px;margin-left:6px}
.hist-i{position:relative;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-i:last-child{border-bottom:0}
.hist-i::before{content:"";position:absolute;left:-21px;top:16px;width:9px;height:9px;border-radius:99px;
  background:var(--text-3);border:2px solid var(--surface)}
.hist-i[data-a="create"]::before{background:var(--ok)}
.hist-i[data-a="update"]::before{background:var(--accent)}
.hist-i[data-a="delete"]::before{background:var(--danger)}

/* ============================= FORMS ============================= */
.form{display:grid;gap:14px}
.form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.form .grid2{grid-template-columns:1fr}}
.field{display:block}
.field>.lab{display:block;font-size:12px;font-weight:640;margin-bottom:5px;color:var(--text-2)}
.field .req{color:var(--danger)}
.field .help{font-size:11.5px;color:var(--text-3);margin-top:4px}
.inp{width:100%;padding:8px 11px;border:1px solid var(--border-2);border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:78px;line-height:1.55}
select.inp{cursor:pointer}
.inline{display:flex;gap:7px;align-items:center}
.inline .inp{flex:1}
.addrow{display:flex;gap:7px;margin-top:7px;padding:9px;background:var(--accent-soft);border-radius:var(--r-sm)}
.addrow .inp{flex:1;background:var(--surface)}
.checklist{border:1px solid var(--border-2);border-radius:var(--r-sm);max-height:190px;overflow:auto;background:var(--surface)}
.checklist label{display:flex;gap:9px;align-items:center;padding:7px 11px;cursor:pointer;
  border-bottom:1px solid var(--border);font-size:13px}
.checklist label:last-child{border-bottom:0}
.checklist label:hover{background:var(--surface-2)}
.checklist input{margin:0;flex:none;width:15px;height:15px;accent-color:var(--accent)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .inp{width:auto;min-width:130px;padding:6px 10px;font-size:12.5px}

/* ============================= MODALS ============================= */
.backdrop{position:fixed;inset:0;background:rgba(10,14,20,.55);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px;z-index:100;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);
  width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;animation:pop .16s ease}
.modal.wide{width:min(840px,100%)}
.modal.narrow{width:min(440px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
  align-items:center;gap:12px}
.modal-b{padding:20px;overflow:auto;flex:1}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;
  background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.warnbox{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13px;line-height:1.55}
.infobox{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13px;line-height:1.55}
.amberbox{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13px;line-height:1.55}

#toastRoot{position:fixed;bottom:22px;right:22px;z-index:200;display:grid;gap:9px;justify-items:end}
.toast{background:var(--text);color:var(--bg);padding:10px 15px;border-radius:9px;font-size:13px;
  font-weight:540;box-shadow:var(--shadow-lg);animation:pop .16s ease;max-width:330px}
.toast.err{background:var(--danger);color:#fff}

.ro-banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--warn);
  padding:9px 16px;font-size:13px;font-weight:560;text-align:center}

.due-over{color:var(--danger);font-weight:650}
.due-soon{color:var(--warn);font-weight:650}
.done-row td{opacity:.52}
.done-row .namecell{text-decoration:line-through}

.listmgr{display:grid;gap:8px}
.listmgr .li{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface-2)}

@media(max-width:860px){
  .shell{flex-direction:column;align-items:stretch}
  .sidebar{width:100%;max-width:100%;position:static;height:auto;display:flex;gap:4px;overflow-x:auto;
    -webkit-overflow-scrolling:touch;border-right:0;border-bottom:1px solid var(--border);padding:8px}
  .sidebar .navlink{flex:0 0 auto}
  .navsec{display:none}
  .navlink{margin:0;white-space:nowrap}
  .content{padding:16px 14px 70px;width:100%;max-width:100%;min-width:0}
  .searchwrap{max-width:none}
  .brandname{display:none}
  table.tbl{min-width:560px}
}
/* phone: let the header wrap instead of forcing the page wider than the screen */
@media(max-width:560px){
  .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px;row-gap:6px}
  .searchwrap{order:5;flex:1 1 100%;max-width:none}
  .savepill{font-size:11px;padding:4px 8px}
  .content{padding:14px 12px 70px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .modal-f{flex-direction:column-reverse;align-items:stretch}
  .modal-f .btn{width:100%;justify-content:center}
  .form .grid2{grid-template-columns:1fr}
  #lock{padding:12px}
  .lockcard{padding:20px}
  #lock .row{flex-wrap:wrap}
  .filters .inp{min-width:0;flex:1 1 130px}
}
</style>
</head>
<body>

<!-- ============ LOCK / LOGIN ============ -->
<div id="lock"></div>

<!-- ============ APP ============ -->
<div id="app" class="hidden"></div>

<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
/* =====================================================================
   Divinheal Partnership Tracker
   Single-file, zero-dependency, static-host friendly (GitHub Pages).
   Data model lives encrypted (AES-GCM / PBKDF2-SHA256) in localStorage,
   one private vault per login. Nothing leaves the browser.
   ===================================================================== */

/* ---------- storage keys ---------- */
const K_ACCOUNTS = 'dh.tracker.accounts.v1';
const K_VAULT    = u => 'dh.tracker.vault.v1.' + u;
const K_SESSION  = 'dh.tracker.session.v1';
const K_THEME    = 'dh.tracker.theme';
const PBKDF2_ITER = 250000;
const MAX_HISTORY = 900;
const MAX_SNAPSHOTS = 20;

/* ---------- tiny utils ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return esc(d);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtTS(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function relTime(ts){
  if(!ts) return '—';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return fmtTS(ts).split(',')[0];
}
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'), t = new Date(todayISO()+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.round((d-t)/86400000);
}
function bytes(n){
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}

/* ---------- toast ---------- */
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, isErr?4200:2100);
}

/* =====================================================================
   CRYPTO
   ===================================================================== */
async function deriveKey(password, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64d(saltB64), iterations:iter||PBKDF2_ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']
  );
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv:b64e(iv), ct:b64e(ct) };
}
async function decryptJSON(key, blob){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* =====================================================================
   ACCOUNTS
   ===================================================================== */
function readAccounts(){ try{ return JSON.parse(localStorage.getItem(K_ACCOUNTS) || '{}'); }catch(e){ return {}; } }
function writeAccounts(a){ localStorage.setItem(K_ACCOUNTS, JSON.stringify(a)); }

async function createAccount(user, password){
  const accts = readAccounts();
  const u = user.trim().toLowerCase();
  if(!u) throw new Error('Pick a username.');
  if(!/^[a-z0-9._-]{2,32}$/.test(u)) throw new Error('Username: 2–32 chars, letters/numbers/._- only.');
  if(accts[u]) throw new Error('That username already exists on this browser.');
  if(password.length < 8) throw new Error('Password must be at least 8 characters.');
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const key = await deriveKey(password, salt, PBKDF2_ITER);
  const verifier = await encryptJSON(key, {ok:true, u});
  accts[u] = { salt, iter:PBKDF2_ITER, verifier, createdAt:Date.now(), display:user.trim() };
  writeAccounts(accts);
  const vault = seedVault(user.trim());
  localStorage.setItem(K_VAULT(u), JSON.stringify(await encryptJSON(key, vault)));
  return { user:u, key, vault };
}
async function unlockAccount(user, password){
  const accts = readAccounts();
  const u = user.trim().toLowerCase();
  const a = accts[u];
  if(!a) throw new Error('No such account on this browser. Create one, or import a backup.');
  const key = await deriveKey(password, a.salt, a.iter);
  try { await decryptJSON(key, a.verifier); }
  catch(e){ throw new Error('Wrong password.'); }
  let vault;
  const raw = localStorage.getItem(K_VAULT(u));
  if(!raw){ vault = seedVault(a.display || u); }
  else { vault = migrate(await decryptJSON(key, JSON.parse(raw))); }
  return { user:u, key, vault };
}

/* =====================================================================
   VAULT SHAPE
   ===================================================================== */
function seedVault(displayName){
  return {
    version: 1,
    createdAt: Date.now(),
    owner: displayName || '',
    globals: {
      b2bTypes: ['NGO','Insurance company','Insurtech / HMO','Corporate / CSR','Government body','Embassy / High Commission',
                 'Diaspora / community body','Religious charity','Professional body','Hospital','Diagnostics network',
                 'Airline / travel agent','Healthcare startup','Trust / Foundation','TPA','Bank / NBFC'],
      partnerTypes: ['Facilitator','Consultant','Broker','Agent','Channel partner','Referral partner','Doctor / Consultant',
                     'Distributor','Advisor','Community leader','Employee / Internal'],
      countries: ['Kenya','Nigeria','Tanzania','Uganda','Ethiopia','Ghana','Zambia','Zimbabwe','Botswana','Rwanda',
                  'UAE','Oman','Saudi Arabia','Qatar','Kuwait','Bahrain','Yemen','Iraq',
                  'Bangladesh','Nepal','Sri Lanka','Myanmar','Maldives','India','Other'],
      stages: ['Not Contacted','Contacted - Awaiting Response','In Discussion','Agreement Shared',
               'Verbal / Signed Commitment','Onboarded','Active','Paused / Dormant',
               'Not Interested','Not Pursuing'],
      itemStatuses: ['Open','In progress','Blocked','Done'],
      priorities: ['High','Medium','Low'],
      institutions: [],
      partnerPriorities: ['P0','P1','P2','P3','Do Not Pursue'],
      researchTiers: ['Strong','Moderate','Weak','Avoid','Competitor'],
      typesOfHelp: ['Warm Introduction (Email/Message)','Call Set Up','In-Person Meeting Arranged',
                    'Reference / Vouching','Other'],
      engagementStages: ['Opportunity Identified','Introduction Requested','Introduction Made',
                         'Call / Meeting Scheduled','Call / Meeting Completed','Relationship Established',
                         'Added to Pipeline','Declined / Not Possible']
    },
    profiles: [], b2b: [], partners: [], meetings: [], openItems: [],
    history: [], snapshots: [],
    meta: { lastSnapshotAt: 0 }
  };
}
function migrate(v){
  const s = seedVault(v.owner);
  v.globals = Object.assign({}, s.globals, v.globals || {});
  for(const k of ['profiles','b2b','partners','meetings','openItems','history','snapshots']) v[k] = v[k] || [];
  v.meta = v.meta || { lastSnapshotAt: 0 };
  v.version = 1;
  return v;
}

/* =====================================================================
   SESSION STATE
   ===================================================================== */
const S = { user:null, key:null, vault:null, readOnly:false, savedAt:null, saving:false, dirty:false };
const V = () => S.vault;
const canEdit = () => !S.readOnly;

/* ---------- auto-save ---------- */
let saveTimer = null;
function save(immediate){
  if(S.readOnly || !S.key) return;
  S.dirty = true; paintSaveState();
  clearTimeout(saveTimer);
  const run = async () => {
    try{
      S.saving = true; paintSaveState();
      maybeSnapshot();
      const blob = await encryptJSON(S.key, S.vault);
      localStorage.setItem(K_VAULT(S.user), JSON.stringify(blob));
      S.savedAt = Date.now(); S.dirty = false; S.saving = false;
      paintSaveState();
      scheduleSyncPush();
    }catch(e){
      S.saving = false; S.dirty = true; paintSaveState(String(e.message||e));
      if(String(e).match(/quota|exceeded/i)) toast('Storage full — export a backup and trim history in Backups.', true);
      else toast('Save failed: '+(e.message||e), true);
    }
  };
  if(immediate) run(); else saveTimer = setTimeout(run, 400);
}
function paintSaveState(err){
  const el = $('#saveState'); if(!el) return;
  if(err){ el.innerHTML = '<span class="dot err"></span> Save error'; el.title = err; return; }
  if(S.saving || S.dirty){ el.innerHTML = '<span class="dot busy"></span> Saving…'; return; }
  el.innerHTML = '<span class="dot"></span> Saved ' + (S.savedAt ? relTime(S.savedAt) : '');
  el.title = S.savedAt ? 'Last saved ' + fmtTS(S.savedAt) : '';
}
setInterval(()=>{ if(!S.dirty && !S.saving) paintSaveState(); paintSyncState(); }, 30000);

/* ---------- rolling snapshots ---------- */
function maybeSnapshot(){
  const v = V();
  const since = Date.now() - (v.meta.lastSnapshotAt || 0);
  if(since < 6*3600*1000) return;
  pushSnapshot('Auto snapshot');
}
function pushSnapshot(label){
  const v = V();
  const payload = clone({ globals:v.globals, profiles:v.profiles, b2b:v.b2b, partners:v.partners,
                          meetings:v.meetings, openItems:v.openItems });
  v.snapshots.unshift({ id:uid(), ts:Date.now(), label:label||'Snapshot', json:JSON.stringify(payload) });
  if(v.snapshots.length > MAX_SNAPSHOTS) v.snapshots.length = MAX_SNAPSHOTS;
  v.meta.lastSnapshotAt = Date.now();
}

/* ---------- change history (per-entry backup) ---------- */
function commit(action, entity, entityId, before, after, label, bundle){
  const v = V();
  v.history.unshift({
    id:uid(), ts:Date.now(), action, entity, entityId,
    label: label || '',
    before: before ? clone(before) : null,
    after:  after  ? clone(after)  : null,
    bundle: bundle ? clone(bundle) : null,
    profileId: (after && after.profileId) || (before && before.profileId) || null,
    parentId:  (after && after.parentId)  || (before && before.parentId)  || null
  });
  if(v.history.length > MAX_HISTORY) v.history.length = MAX_HISTORY;
  save();
}

/* =====================================================================
   CLOUD SYNC — private GitHub Gist, ciphertext only
   The vault is encrypted locally BEFORE anything is sent. GitHub stores an
   opaque blob it cannot read; the key is derived from your password and
   never leaves this browser. The KDF salt travels with the blob so another
   device can derive the same key from the same password.
   ===================================================================== */
const K_SYNC    = u => 'dh.tracker.sync.v1.' + u;
const K_DEVICE  = 'dh.tracker.device.v1';
const GIST_FILE = 'divinheal-tracker.vault.json';
const GIST_DESC = 'Divinheal Partnership Tracker — encrypted vault (do not edit by hand)';
const SYNC_DEBOUNCE = 4000;

const SY = { token:null, gistId:null, lastSeenAt:0, lastSyncAt:0, status:'off', error:null, pending:false };

function deviceName(){
  let d = null;
  try{ d = localStorage.getItem(K_DEVICE); }catch(_){}
  if(!d){
    const ua = navigator.userAgent;
    const os = /Windows/.test(ua) ? 'Windows' : /Macintosh|Mac OS/.test(ua) ? 'Mac'
             : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS'
             : /Linux/.test(ua) ? 'Linux' : 'Device';
    d = os + '-' + uid().slice(0,4);
    try{ localStorage.setItem(K_DEVICE, d); }catch(_){}
  }
  return d;
}

async function loadSyncConfig(){
  Object.assign(SY, {token:null, gistId:null, lastSeenAt:0, status:'off', error:null, pending:false});
  let raw = null;
  try{ raw = localStorage.getItem(K_SYNC(S.user)); }catch(_){}
  if(!raw) return;
  try{
    const cfg = await decryptJSON(S.key, JSON.parse(raw));
    SY.token = cfg.token; SY.gistId = cfg.gistId;
    SY.lastSeenAt = cfg.lastSeenAt || 0; SY.lastSyncAt = cfg.lastSyncAt || 0;
    SY.status = 'idle';
  }catch(e){ SY.status = 'off'; }
}
async function saveSyncConfig(){
  if(S.readOnly) return;
  try{
    if(!SY.token){ localStorage.removeItem(K_SYNC(S.user)); return; }
    const blob = await encryptJSON(S.key, {token:SY.token, gistId:SY.gistId,
                                           lastSeenAt:SY.lastSeenAt, lastSyncAt:SY.lastSyncAt});
    localStorage.setItem(K_SYNC(S.user), JSON.stringify(blob));
  }catch(e){ /* non-fatal */ }
}

/* ---------- GitHub API ---------- */
async function ghFetch(path, opts, token){
  let r;
  try{
    r = await fetch('https://api.github.com' + path, Object.assign({
      headers: { 'Authorization':'Bearer ' + (token || SY.token),
                 'Accept':'application/vnd.github+json',
                 'X-GitHub-Api-Version':'2022-11-28',
                 'Content-Type':'application/json' }
    }, opts || {}));
  }catch(e){
    throw new Error('Could not reach GitHub. Check your internet connection.');
  }
  if(!r.ok){
    let msg = r.status + ' ' + r.statusText;
    try{ const j = await r.json(); if(j && j.message) msg = j.message; }catch(_){}
    if(r.status === 401) msg = 'GitHub rejected the token (401). It must be a CLASSIC token with the "gist" scope — fine-grained tokens cannot access gists.';
    if(r.status === 403) msg = 'GitHub refused the request (403): ' + msg + '. Usually a missing "gist" scope, or a rate limit.';
    if(r.status === 404) msg = 'Gist not found (404). It may have been deleted, or this token cannot see it.';
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}
async function gistReadPayload(gistId, token){
  const g = await ghFetch('/gists/' + gistId, null, token);
  const f = g.files && g.files[GIST_FILE];
  if(!f) throw new Error('That gist does not contain a tracker vault.');
  let content = f.content;
  if(f.truncated && f.raw_url){
    const rr = await fetch(f.raw_url);
    if(!rr.ok) throw new Error('Could not download the full vault from GitHub.');
    content = await rr.text();
  }
  let p;
  try{ p = JSON.parse(content); }catch(e){ throw new Error('The synced vault is corrupted.'); }
  if(!p || p.app !== 'divinheal-tracker' || !p.blob) throw new Error('That gist is not a tracker vault.');
  return p;
}
async function buildSyncPayload(){
  const a = readAccounts()[S.user] || {};
  const blob = await encryptJSON(S.key, S.vault);
  return { app:'divinheal-tracker', kind:'sync', version:1,
           updatedAt: Date.now(), device: deviceName(), account: S.user,
           kdf: { salt:a.salt, iter:a.iter, algo:'PBKDF2-SHA256', cipher:'AES-256-GCM' },
           blob };
}

/* ---------- push / pull ---------- */
let syncTimer = null;
function scheduleSyncPush(){
  if(!SY.token || S.readOnly) return;
  SY.pending = true; paintSyncState();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncPush(), SYNC_DEBOUNCE);
}

async function syncPush(opts){
  opts = opts || {};
  if(!SY.token || S.readOnly) return;
  clearTimeout(syncTimer);
  SY.status = 'syncing'; SY.error = null; paintSyncState();
  try{
    if(SY.gistId && !opts.force){
      let remote = null;
      try{ remote = await gistReadPayload(SY.gistId); }
      catch(e){ if(!/404|not found/i.test(e.message)) throw e; }
      if(remote && remote.updatedAt > SY.lastSeenAt && remote.device !== deviceName()){
        const pick = await choiceDialog({
          title:'Both devices have changes',
          message:'<b>'+esc(remote.device)+'</b> saved changes at '+esc(fmtTS(remote.updatedAt))+
                  ', after this device last synced.<br><br>Whichever version you discard is snapshotted '+
                  'first, so it stays recoverable under <b>Backups &rsaquo; Snapshots</b>.',
          choices:[
            {label:'Keep this device’s version', cls:'btn-primary'},
            {label:'Take the other device’s version', cls:''},
            {label:'Do nothing for now', cls:'btn-ghost'}
          ]});
        if(pick === 1){ await applyRemote(remote); SY.status='idle'; paintSyncState(); return; }
        if(pick !== 0){ SY.status='idle'; SY.pending=true; paintSyncState(); return; }
        pushSnapshot('Before overwriting sync from ' + remote.device);
      }
    }
    const payload = await buildSyncPayload();
    const body = { description: GIST_DESC, files: {} };
    body.files[GIST_FILE] = { content: JSON.stringify(payload) };
    let res;
    if(SY.gistId){
      res = await ghFetch('/gists/' + SY.gistId, {method:'PATCH', body: JSON.stringify(body)});
    } else {
      body.public = false;
      res = await ghFetch('/gists', {method:'POST', body: JSON.stringify(body)});
      SY.gistId = res.id;
    }
    SY.lastSeenAt = payload.updatedAt;
    SY.lastSyncAt = Date.now();
    SY.status = 'idle'; SY.pending = false; SY.error = null;
    await saveSyncConfig();
    if(opts.announce) toast('Synced to GitHub.');
  }catch(e){
    SY.status = 'error'; SY.error = e.message || String(e);
    if(opts.announce) toast('Sync failed: ' + SY.error, true);
  }
  paintSyncState();
}

function askPassword({title, message, label}){
  return new Promise(resolve=>{
    $('#confirmRoot').innerHTML =
      '<div class="backdrop" data-abd><div class="modal narrow" role="dialog" aria-modal="true">'+
        '<div class="modal-h"><h2>'+esc(title)+'</h2></div>'+
        '<div class="modal-b"><div class="infobox" style="margin-bottom:14px">'+message+'</div>'+
          '<label class="field"><span class="lab">'+esc(label||'Password')+'</span>'+
          '<input class="inp" type="password" id="apPass" autocomplete="current-password"></label></div>'+
        '<div class="modal-f"><button class="btn" id="apNo">Cancel</button>'+
          '<button class="btn btn-primary" id="apYes">Continue</button></div>'+
      '</div></div>';
    const root = $('#confirmRoot');
    const done = v => { root.innerHTML=''; resolve(v); };
    root.querySelector('#apNo').onclick = ()=>done(null);
    root.querySelector('#apYes').onclick = ()=>done(root.querySelector('#apPass').value);
    root.querySelector('[data-abd]').onclick = e => { if(e.target.hasAttribute('data-abd')) done(null); };

  });

/* Returns a key that actually opens `remote`, asking for the password and
   re-deriving from the remote salt when this device has its own. */
async function keyForRemote(remote){
  if(S.key){
    try{ await decryptJSON(S.key, remote.blob); return {key:S.key, rekey:false}; }catch(_){}
  }
  if(!remote.kdf || !remote.kdf.salt)
    throw new Error('That synced vault is too old to open here - re-enable sync on the other device.');
  const pass = await askPassword({
    title:'Confirm your password',
    message:'This device set up its own account, so it has a different encryption salt and cannot '+
            'open the synced vault yet.<br><br>Enter the password you use on your <b>other device</b> '+
            'and this device will adopt that vault.',
    label:'Password from your other device'});
  if(pass === null) throw new Error('Cancelled.');
  const k = await deriveKey(pass, remote.kdf.salt, remote.kdf.iter || PBKDF2_ITER);
  try{ await decryptJSON(k, remote.blob); }
  catch(e){ throw new Error('That password does not open the synced vault.'); }
  return {key:k, rekey:true};
}

async function applyRemote(remote){
  const got = await keyForRemote(remote);
  const v = await decryptJSON(got.key, remote.blob);
  if(got.rekey){
    // adopt the synced vault's KDF so every later sync on this device just works
    const accts = readAccounts(), a = accts[S.user];
    if(a){
      a.salt = remote.kdf.salt;
      a.iter = remote.kdf.iter || PBKDF2_ITER;
      a.verifier = await encryptJSON(got.key, {ok:true, u:S.user});
      writeAccounts(accts);
    }
    S.key = got.key;
    await stashSession();
    toast('This device now shares the synced vault.');
  }
  pushSnapshot('Before pulling sync from ' + remote.device);
  const keepSnaps = S.vault.snapshots;
  S.vault = migrate(v);
  S.vault.snapshots = keepSnaps.concat(S.vault.snapshots || []).slice(0, MAX_SNAPSHOTS);
  SY.lastSeenAt = remote.updatedAt;
  SY.lastSyncAt = Date.now();
  SY.pending = false;
  await saveSyncConfig();
  save(true);
  toast('Pulled the latest from ' + remote.device + '.');
  render();
}

async function syncPull(opts){
  opts = opts || {};
  if(!SY.token || !SY.gistId || S.readOnly) return;
  SY.status = 'syncing'; SY.error = null; paintSyncState();
  try{
    const remote = await gistReadPayload(SY.gistId);
    if(remote.updatedAt > SY.lastSeenAt && remote.device !== deviceName()){
      if(SY.pending){
        const pick = await choiceDialog({
          title:'Both devices have changes',
          message:'<b>'+esc(remote.device)+'</b> has changes from '+esc(fmtTS(remote.updatedAt))+
                  ', and this device has unsynced changes too.<br><br>The version you discard is snapshotted first.',
          choices:[
            {label:'Take the other device’s version', cls:'btn-primary'},
            {label:'Keep this device’s version', cls:''},
            {label:'Decide later', cls:'btn-ghost'}
          ]});
        if(pick === 1){ SY.status='idle'; paintSyncState(); syncPush({force:true, announce:true}); return; }
        if(pick !== 0){ SY.status='idle'; paintSyncState(); return; }
      }
      await applyRemote(remote);
    } else if(opts.announce){
      toast('Already up to date.');
    }
    SY.status = 'idle'; SY.error = null;
  }catch(e){
    SY.status = 'error'; SY.error = e.message || String(e);
    if(opts.announce) toast('Sync failed: ' + SY.error, true);
  }
  paintSyncState();
}

function paintSyncState(){
  const el = document.getElementById('syncState');
  if(!el) return;
  if(!SY.token){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  let dot = '', label = 'Sync on';
  if(SY.status === 'syncing'){ dot = 'busy'; label = 'Syncing…'; }
  else if(SY.status === 'error'){ dot = 'err'; label = 'Sync error'; }
  else if(SY.pending){ dot = 'busy'; label = 'Sync queued'; }
  else if(SY.lastSyncAt){ label = 'Synced ' + relTime(SY.lastSyncAt); }
  el.innerHTML = '<span class="dot ' + dot + '"></span>☁ ' + esc(label);
  el.title = SY.error ? SY.error : (SY.lastSyncAt ? 'Last synced ' + fmtTS(SY.lastSyncAt) : 'Cloud sync is on');
}

      const tok = $('#syTok').value.trim();
      const gid = $('#syGist').value.trim();
      if(!tok){ toast('Paste your token first.', true); return false; }
      try{
        await ghFetch('/user', null, tok);
        SY.token = tok; SY.gistId = gid || null; SY.lastSeenAt = 0;
        if(gid){
          const remote = await gistReadPayload(gid, tok);
          const pick = await choiceDialog({
            title:'Join this synced vault',
            message:'That gist holds a vault last saved by <b>'+esc(remote.device||'another device')+'</b> at '+
                    esc(fmtTS(remote.updatedAt))+'.<br><br>Which version should win right now?',
            choices:[
              {label:'Take the gist’s version', cls:'btn-primary'},
              {label:'Keep this device and overwrite the gist', cls:''},
              {label:'Cancel', cls:'btn-ghost'}
            ]});
          if(pick === -1 || pick === 2){ SY.token=null; SY.gistId=null; SY.status='off'; return false; }
          if(pick === 0){ await applyRemote(remote); await saveSyncConfig(); toast('Cloud sync is on.'); render(); return true; }
        }
        await syncPush({force:true});
        if(SY.status === 'error') throw new Error(SY.error);
        toast('Cloud sync is on.');
        render();
        return true;
      }catch(e){
        SY.token = null; SY.gistId = null; SY.status = 'off';
        toast(e.message || String(e), true);
        return false;
      }
    }}]
  });
}

async function syncDisconnect(){
  const ok = await confirmDialog({
    title:'Turn off cloud sync?', danger:true, confirmLabel:'Turn off sync',
    message:'This device stops syncing and forgets the token.<br><br>'+
      'Your data stays here, and the gist stays on GitHub — delete it yourself at '+
      '<a href="https://gist.github.com" target="_blank" rel="noopener noreferrer">gist.github.com ↗</a> if you want it gone.' });
  if(!ok) return;
  SY.token = null; SY.gistId = null; SY.status = 'off'; SY.pending = false;
  try{ localStorage.removeItem(K_SYNC(S.user)); }catch(_){}
  toast('Cloud sync turned off.');
  render();
}

/* ---------- joining from a brand-new device (lock screen) ---------- */
function syncJoinDialog(){
  openModal({
    title:'Sign in on this device from sync',
    size:'wide',
    bodyHTML:
      '<div class="infobox" style="margin-bottom:16px">Pulls your encrypted vault from GitHub and sets this '+
      'device up with it. You need the <b>same password</b> you use elsewhere — it is the decryption key, '+
      'and nothing can recover the data without it.</div>'+
      syncSetupStepsHTML()+
      '<div class="form">'+
        '<label class="field"><span class="lab">GitHub token <span class="req">*</span></span>'+
          '<input class="inp mono" type="password" id="sjTok" autocomplete="off" spellcheck="false" placeholder="ghp_…"></label>'+
        '<label class="field"><span class="lab">Your password <span class="req">*</span></span>'+
          '<input class="inp" type="password" id="sjPass" autocomplete="current-password">'+
          '<div class="help">The same password you set on your other device.</div></label>'+
        '<label class="field"><span class="lab">Gist ID (optional)</span>'+
          '<input class="inp mono" type="text" id="sjGist" autocomplete="off" spellcheck="false" placeholder="leave blank and I will find it">'+
          '<div class="help">Left blank, the tracker scans your gists for the vault automatically.</div></label>'+
      '</div>',
    actions:[{label:'Cancel'},{label:'Pull my data', cls:'btn-primary', onClick: async ()=>{
      const tok = $('#sjTok').value.trim();
      const pass = $('#sjPass').value;
      let gid = $('#sjGist').value.trim();
      if(!tok || !pass){ toast('Token and password are both needed.', true); return false; }
      try{
        await ghFetch('/user', null, tok);
        if(!gid){
          const list = await ghFetch('/gists?per_page=100', null, tok);
          const hits = (list || []).filter(g => g.files && g.files[GIST_FILE])
                        .sort((a,b) => String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
          if(!hits.length) throw new Error('No synced tracker vault found in your gists. Paste the gist ID explicitly, or turn sync on from your other device first.');
          if(hits.length === 1) gid = hits[0].id;
          else {
            // never silently guess between several vaults
            const pick = await choiceDialog({
              title:'Several synced vaults found',
              message:'This GitHub account holds '+hits.length+' tracker vaults. Pick the one to sign in to — newest first.',
              choices: hits.slice(0,6).map(g => ({
                label: g.id.slice(0,10) + '…  ·  updated ' +
                       (g.updated_at ? new Date(g.updated_at).toLocaleString('en-GB') : 'unknown'), cls:'' }))
            });
            if(pick < 0) return false;
            gid = hits[pick].id;
          }
        }
        const payload = await gistReadPayload(gid, tok);
        const user = (payload.account || 'me');
        const key = await deriveKey(pass, payload.kdf.salt, payload.kdf.iter);
        let vault;
        try{ vault = await decryptJSON(key, payload.blob); }
        catch(e){ throw new Error('That password does not open this vault. It must match the one used on your other device.'); }

        const accts = readAccounts();
        accts[user] = { salt:payload.kdf.salt, iter:payload.kdf.iter,
                        verifier: await encryptJSON(key, {ok:true, u:user}),
                        createdAt: Date.now(), display: user };
        writeAccounts(accts);

        S.user = user; S.key = key; S.vault = migrate(vault); S.readOnly = false;
        localStorage.setItem(K_VAULT(user), JSON.stringify(await encryptJSON(key, S.vault)));
        SY.token = tok; SY.gistId = gid; SY.lastSeenAt = payload.updatedAt; SY.lastSyncAt = Date.now();
        SY.status = 'idle'; SY.pending = false;
        await saveSyncConfig();
        await stashSession();

        $('#lock').classList.add('hidden');
        $('#app').classList.remove('hidden');
        location.hash = '#/dash';
        render();
        toast('Signed in as "' + user + '" — data pulled from ' + (payload.device || 'sync') + '.');
        return true;
      }catch(e){ toast(e.message || String(e), true); return false; }
    }}]
  });
}

/* =====================================================================
   PARTNER ONBOARDING & RATING
   Carried over unchanged from the Divinheal sheet: the 5-item onboarding
   checklist, the 8-dimension rating model out of 40, and its tier bands.
   ===================================================================== */
const ONBOARD_ITEMS = [
  ['onlineMeeting','Online meeting done',      'A real-time video/voice call has happened (Zoom, Teams, WhatsApp call) beyond written outreach.'],
  ['whatsappGroup','WhatsApp group created',   'A shared channel exists for fast day-to-day case coordination.'],
  ['contentShared','Digital content shared',   'They have our pitch materials and any patient-facing content they need to refer confidently.'],
  ['cadenceSet',   'Meeting cadence set',      'A recurring check-in cadence has been agreed (need not literally be weekly).'],
  ['readyToEngage','Ready to engage',          'They understand the model well enough to introduce us by name and vouch for us.']
];
const RATING_DIMS = [
  ['patientAccess', 'Patient Access',      'Real access to patients needing our target treatments. 1 = little relevant contact, 5 = direct and frequent.'],
  ['trustInfluence','Trust / Influence',   'How much their recommendation moves a decision. 1 = no real influence, 5 = decisions follow their word.'],
  ['followUp',      'Follow-up Discipline','Reliability on cases and commitments. 1 = goes quiet, 5 = consistently responsive.'],
  ['teamStrength',  'Team Strength',       'People behind them. 1 = one person no backup, 5 = a real team or institution.'],
  ['outreachAbility','Outreach Ability',   'Can originate leads, not just react. 1 = passive only, 5 = actively originates.'],
  ['systemAdoption','System Adoption',     'Willingness to use our tools and process. 1 = resists, 5 = adopts fully.'],
  ['transparency',  'Transparency',        'Openness about business, incentives and conflicts. 1 = opaque, 5 = fully transparent.'],
  ['commitment',    'Commitment',          'Real time and effort invested so far. 1 = none shown, 5 = already invested real effort.']
];
const RATING_MAX = RATING_DIMS.length * 5;

function ratingTotal(e){
  return RATING_DIMS.reduce((s,[k]) => s + (Number(e.rating && e.rating[k]) || 0), 0);
}
function ratingScored(e){
  return RATING_DIMS.filter(([k]) => Number(e.rating && e.rating[k]) > 0).length;
}
function capabilityTier(total){
  if(total >= 32) return 'Strategic Growth';
  if(total >= 24) return 'Build-with-Us';
  if(total >= 16) return 'Referral';
  return 'Low Priority';
}
function tierBadgeClass(t){
  return { 'Strategic Growth':'b-green', 'Build-with-Us':'b-blue', 'Referral':'b-amber', 'Low Priority':'' }[t] || '';
}
function onboardDone(e){
  return ONBOARD_ITEMS.filter(([k]) => (e.onboarding && e.onboarding[k]) === 'Yes').length;
}
/* the sheet's gate: all five checklist items Yes AND total score 24+ */
function isOnboarded(e){
  return onboardDone(e) === ONBOARD_ITEMS.length && ratingTotal(e) >= 24;
}
function tierBadge(e){
  const t = capabilityTier(ratingTotal(e));
  return '<span class="badge '+tierBadgeClass(t)+'">'+esc(t)+'</span>';
}
function prioBadgeP(p){
  const map = {'P0':'b-red','P1':'b-red','P2':'b-amber','P3':'','Do Not Pursue':'b-red'};
  return p ? '<span class="badge '+(map[p]||'')+'">'+esc(p)+'</span>' : '<span class="dim">—</span>';
}
function researchBadge(t){
  const map = {'Strong':'b-green','Moderate':'b-blue','Weak':'b-amber','Avoid':'b-red','Competitor':'b-purple'};
  return t ? '<span class="badge '+(map[t]||'')+'">'+esc(t)+'</span>' : '<span class="dim">—</span>';
}

/* Update the live totals in place. A full render() here would rebuild every select
   mid-edit, losing focus and making rapid data entry unusable. */
function paintScoring(type, id){
  const e = entity(type, id);
  if(!e) return;
  const total = ratingTotal(e), tier = capabilityTier(total);
  const done = onboardDone(e), onboarded = isOnboarded(e);
  const set = (sel, html, cls) => {
    const el = document.getElementById(sel);
    if(!el) return;
    el.innerHTML = html;
    if(cls !== undefined) el.className = cls;
  };
  set('scDone', done + ' / 5 done', 'badge ' + (done === 5 ? 'b-green' : 'b-amber'));
  set('scTotal', total + ' / ' + RATING_MAX, 'badge b-blue');
  set('scTier', esc(tier), 'badge ' + tierBadgeClass(tier));
  set('scTotalBig', String(total));
  const gate = document.getElementById('scGate');
  if(gate){
    gate.className = onboarded ? 'infobox' : 'amberbox';
    gate.innerHTML = onboarded
      ? '<b>\u2713 Onboarded.</b> All five checklist items are Yes and the score is ' + total +
        ' (24+). Move this partner into active engagement.'
      : '<b>Not yet onboarded.</b> ' +
        (done < 5 ? (5 - done) + ' checklist item' + (5 - done > 1 ? 's' : '') + ' outstanding. '
                  : 'Checklist complete. ') +
        (total < 24 ? 'Score is ' + total + ', needs 24+ (Build-with-Us or better).'
                    : 'Score of ' + total + ' clears the gate.');
  }
  const tabBtn = document.querySelector('[data-tab="scoring"] .cnt');
  if(tabBtn) tabBtn.textContent = done + '/5 \u00b7 ' + total;
}

  html +=
    '<div class="card" style="margin-bottom:16px"><div class="card-head">'+
      '<div><h2>Partner rating</h2><div class="muted tiny">Eight dimensions, 1–5 each. '+
        (scored ? scored+' of 8 scored.' : 'Not scored yet — a fresh partner sits at Low Priority by design, not by mistake.')+'</div></div>'+
      '<div class="row"><span class="badge b-blue" id="scTotal">'+total+' / '+RATING_MAX+'</span>'+
        '<span class="badge '+tierBadgeClass(tier)+'" id="scTier">'+esc(tier)+'</span></div>'+
    '</div><div class="card-pad" style="display:grid;gap:12px">'+
      RATING_DIMS.map(([k,label,help]) =>
        '<div class="spread" style="gap:16px;align-items:flex-start">'+
          '<div class="grow"><div style="font-weight:600;font-size:13.5px">'+esc(label)+'</div>'+
          '<div class="muted tiny" style="margin-top:2px">'+esc(help)+'</div></div>'+
          sel('rt_'+k, e.rating && e.rating[k], scale,
              'data-score="'+esc(k)+'" data-t="'+type+'" data-id="'+id+'"')+
        '</div>').join('')+
      '<div style="border-top:1px solid var(--border);padding-top:12px" class="spread">'+
        '<div><b>Total</b> <span class="muted tiny">32–40 Strategic Growth · 24–31 Build-with-Us · 16–23 Referral · below 16 Low Priority</span></div>'+
        '<div style="font-size:22px;font-weight:700"><span id="scTotalBig">'+total+'</span>'+
          '<span class="muted" style="font-size:14px">/'+RATING_MAX+'</span></div>'+

    '</div></div>';

  html +=
    '<div id="scGate" class="'+(onboarded?'infobox':'amberbox')+'">'+
      (onboarded
        ? '<b>✓ Onboarded.</b> All five checklist items are Yes and the score is '+total+' (24+). '+
          'Move this partner into active engagement.'
        : '<b>Not yet onboarded.</b> '+
          (done < 5 ? (5-done)+' checklist item'+(5-done>1?'s':'')+' outstanding. ' : 'Checklist complete. ')+
          (total < 24 ? 'Score is '+total+', needs 24+ (Build-with-Us or better).' : 'Score of '+total+' clears the gate.'))+
    '</div>';

  return html;
}

    'Proposal shared':'b-blue','In discussion':'b-blue','Initial contact':'b-purple','Identified':'',
    'On hold':'b-amber','Dropped':'b-red'};

function dueCell(item){
  if(!item.due) return '<span class="dim">—</span>';
  if(item.status==='Done') return '<span class="dim">'+fmtDate(item.due)+'</span>';
  const d = daysUntil(item.due);
  if(d===null) return esc(item.due);
  if(d<0)  return '<span class="due-over">'+fmtDate(item.due)+' · '+Math.abs(d)+'d late</span>';
  if(d<=3) return '<span class="due-soon">'+fmtDate(item.due)+(d===0?' · today':' · in '+d+'d')+'</span>';
  return fmtDate(item.due);
}

   ===================================================================== */
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openModal({title, bodyHTML, actions, size, onMount}){
  const acts = (actions||[]).map((a,i)=>
    '<button class="btn '+(a.cls||'')+'" data-mact="'+i+'">'+esc(a.label)+'</button>').join('');
  $('#modalRoot').innerHTML =
    '<div class="backdrop" data-mbackdrop>'+
      '<div class="modal '+(size||'')+'" role="dialog" aria-modal="true">'+
        '<div class="modal-h"><h2>'+esc(title)+'</h2>'+
          '<button class="btn btn-ghost btn-icon" data-mclose aria-label="Close">✕</button></div>'+
        '<div class="modal-b">'+bodyHTML+'</div>'+
        (acts ? '<div class="modal-f">'+acts+'</div>' : '')+
      '</div></div>';
  const root = $('#modalRoot');
  root.querySelector('[data-mclose]').onclick = closeModal;
  root.querySelector('[data-mbackdrop]').onclick = e => { if(e.target.hasAttribute('data-mbackdrop')) closeModal(); };
  (actions||[]).forEach((a,i)=>{
    root.querySelector('[data-mact="'+i+'"]').onclick = async () => {
      if(!a.onClick){ closeModal(); return; }
      const r = await a.onClick();
      if(r !== false) closeModal();
    };
  });
  if(onMount) onMount(root);
  const first = root.querySelector('.modal-b input, .modal-b textarea, .modal-b select');
  if(first) setTimeout(()=>first.focus(),40);
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if($('#confirmRoot').innerHTML) $('#confirmRoot').innerHTML='';
    else if($('#modalRoot').innerHTML) closeModal();
  }
});

/* ---------- confirm (separate root so it can stack over a form) ---------- */
function confirmDialog({title, message, confirmLabel, danger, requireText}){
  return new Promise(resolve=>{
    const rq = requireText
      ? '<div style="margin-top:14px"><label class="field"><span class="lab">Type <b class="mono">'+esc(requireText)+
        '</b> to confirm</span><input class="inp mono" id="cfmText" autocomplete="off" placeholder="'+esc(requireText)+'"></label></div>'
      : '';
    $('#confirmRoot').innerHTML =
      '<div class="backdrop" data-cbd><div class="modal narrow" role="alertdialog" aria-modal="true">'+
        '<div class="modal-h"><h2>'+esc(title)+'</h2></div>'+
        '<div class="modal-b"><div class="'+(danger?'warnbox':'infobox')+'">'+message+'</div>'+rq+'</div>'+
        '<div class="modal-f">'+
          '<button class="btn" id="cfmNo">Cancel</button>'+
          '<button class="btn '+(danger?'btn-danger':'btn-primary')+'" id="cfmYes"'+(requireText?' disabled':'')+'>'+
            esc(confirmLabel||'Confirm')+'</button>'+
        '</div></div></div>';
    const root = $('#confirmRoot');
    const done = v => { root.innerHTML=''; resolve(v); };
    root.querySelector('#cfmNo').onclick = ()=>done(false);
    root.querySelector('#cfmYes').onclick = ()=>done(true);
    root.querySelector('[data-cbd]').onclick = e => { if(e.target.hasAttribute('data-cbd')) done(false); };
    if(requireText){
      const t = root.querySelector('#cfmText'), y = root.querySelector('#cfmYes');
      t.oninput = ()=>{ y.disabled = t.value.trim() !== requireText; };
      t.onkeydown = e => { if(e.key==='Enter' && !y.disabled) done(true); };
      setTimeout(()=>t.focus(),50);
    } else setTimeout(()=>root.querySelector('#cfmYes').focus(),50);
  });
}

    const opts = (f.options||[]).map(o=>'<option value="'+esc(o)+'"'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'</option>').join('');

          '<button type="button" class="btn btn-primary btn-sm" data-gsave="'+esc(f.global)+'" data-gfor="'+esc(f.name)+'">Add</button>'+
          '<button type="button" class="btn btn-sm" data-gcancel data-gfor="'+esc(f.name)+'">Cancel</button>'+
        '</div>';
    }
  } else if(f.type === 'multi'){
    const sel = new Set((f.value||[]).map(String));
    const rows = (f.options||[]).map(o=>{
      const v = typeof o === 'object' ? o.value : o;
      const l = typeof o === 'object' ? o.label : o;
      return '<label><input type="checkbox" name="'+esc(f.name)+'" value="'+esc(v)+'"'+(sel.has(String(v))?' checked':'')+'><span>'+esc(l)+'</span></label>';
    }).join('');
    ctrl = '<div class="checklist" data-multi="'+esc(f.name)+'">'+(rows || '<div style="padding:12px" class="dim small">Nothing to pick yet.</div>')+'</div>';
    if(f.global && canEdit()){
      ctrl += '<div class="inline" style="margin-top:7px">'+
        '<button type="button" class="btn btn-sm" data-gadd="'+esc(f.global)+'" data-gfor="'+esc(f.name)+'">＋ Add new to global list</button></div>'+
        '<div class="addrow hidden" data-growname="'+esc(f.name)+'">'+
          '<input class="inp" type="text" placeholder="New entry…" data-gin="'+esc(f.name)+'">'+
          '<button type="button" class="btn btn-primary btn-sm" data-gsave="'+esc(f.global)+'" data-gfor="'+esc(f.name)+'">Add</button>'+
          '<button type="button" class="btn btn-sm" data-gcancel data-gfor="'+esc(f.name)+'">Cancel</button>'+
        '</div>';
    }
  } else {
    ctrl = '<input class="inp" type="'+(f.type||'text')+'" name="'+esc(f.name)+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder||'')+'"'+(f.type==='date'?'':'')+'>';
  }
  return '<label class="field">'+lab+ctrl+help+'</label>';
}

function readForm(fields, root){
  const out = {};
  for(const f of fields){
    if(f.type === 'multi'){
      out[f.name] = $$('[data-multi="'+f.name+'"] input:checked', root).map(i=>i.value);
    } else {
      const el = root.querySelector('[name="'+f.name+'"]');
      out[f.name] = el ? el.value.trim() : '';
    }
  }
  return out;
}

function openForm({title, fields, submitLabel, onSubmit, size, intro}){
  const groups = [];
  let buf = [];
  for(const f of fields){
    if(f.half){ buf.push(f); if(buf.length===2){ groups.push('<div class="grid2">'+buf.map(fieldHTML).join('')+'</div>'); buf=[]; } }
    else { if(buf.length){ groups.push('<div class="grid2">'+buf.map(fieldHTML).join('')+'</div>'); buf=[]; } groups.push(fieldHTML(f)); }
  }
  if(buf.length) groups.push('<div class="grid2">'+buf.map(fieldHTML).join('')+'</div>');

  openModal({
    title, size,
    bodyHTML: (intro ? '<div class="infobox" style="margin-bottom:16px">'+intro+'</div>' : '') +
              '<div class="form" id="mform">'+groups.join('')+'</div>',
    actions:[
      {label:'Cancel'},
      {label: submitLabel||'Save', cls:'btn-primary', onClick: ()=>{
        const root = $('#mform');
        const v = readForm(fields, root);
        for(const f of fields){
          if(f.required && (!v[f.name] || (Array.isArray(v[f.name]) && !v[f.name].length))){
            toast('"'+f.label+'" is required.', true);
            const el = root.querySelector('[name="'+f.name+'"]'); if(el) el.focus();
            return false;
          }
        }
        onSubmit(v);
        return true;
      }}
    ],
    onMount: root => {
      // "+ New" global-option handling
      root.addEventListener('click', e=>{
        const add = e.target.closest('[data-gadd]');
        if(add){ const r = root.querySelector('[data-growname="'+add.dataset.gfor+'"]');
                 r.classList.remove('hidden'); r.querySelector('[data-gin]').focus(); return; }
        const cancel = e.target.closest('[data-gcancel]');
        if(cancel){ const r = root.querySelector('[data-growname="'+cancel.dataset.gfor+'"]');
                    r.classList.add('hidden'); r.querySelector('[data-gin]').value=''; return; }
        const sv = e.target.closest('[data-gsave]');
        if(sv){ addGlobalFromForm(root, sv.dataset.gsave, sv.dataset.gfor); return; }
      });
      root.addEventListener('keydown', e=>{
        const inp = e.target.closest('[data-gin]');
        if(inp && e.key==='Enter'){
          e.preventDefault();
          const row = inp.closest('[data-growname]');
          const sv = row.querySelector('[data-gsave]');
          addGlobalFromForm(root, sv.dataset.gsave, sv.dataset.gfor);
        }
      });
    }
  });
}

function addGlobalFromForm(root, listKey, fieldName){
  const row = root.querySelector('[data-growname="'+fieldName+'"]');
  const inp = row.querySelector('[data-gin]');
  const val = inp.value.trim();
  if(!val){ toast('Type something first.', true); return; }
  const list = V().globals[listKey];
  const exists = list.find(x => x.toLowerCase() === val.toLowerCase());
  if(!exists){
    list.push(val);
    list.sort((a,b)=>a.localeCompare(b));
    commit('update','global', listKey, null, {list:listKey, added:val}, 'Added "'+val+'" to '+globalLabel(listKey));
    toast('Added "'+val+'" — it will be in this dropdown from now on.');
  } else { toast('"'+exists+'" is already in the list.'); }
  const final = exists || val;

  const sel = root.querySelector('select[name="'+fieldName+'"]');
  if(sel){
    if(!Array.from(sel.options).some(o=>o.value===final)){
      const o = document.createElement('option'); o.value=final; o.textContent=final; sel.appendChild(o);
    }
    sel.value = final;
  }
  const cl = root.querySelector('[data-multi="'+fieldName+'"]');
  if(cl){
    if(!Array.from(cl.querySelectorAll('input')).some(i=>i.value===final)){
      const l = document.createElement('label');
      l.innerHTML = '<input type="checkbox" name="'+esc(fieldName)+'" value="'+esc(final)+'" checked><span>'+esc(final)+'</span>';
      cl.appendChild(l);
      const ph = cl.querySelector('div.dim'); if(ph) ph.remove();
    } else {
      const i = Array.from(cl.querySelectorAll('input')).find(i=>i.value===final); if(i) i.checked = true;
    }
  }
  row.classList.add('hidden'); inp.value='';
}
function globalLabel(k){
  return { b2bTypes:'partnership types', partnerTypes:'partner types', countries:'countries',
           stages:'stages', itemStatuses:'open-item statuses', priorities:'priorities',
           institutions:'institutions' }[k] || k;
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function parseRoute(){
  const h = (location.hash || '#/dash').replace(/^#/, '');
  const [path, qs] = h.split('?');
  return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(qs || '') };
}
function nav(to){ location.hash = to; }
window.addEventListener('hashchange', ()=>{ if(S.vault) render(); });

/* =====================================================================
   RENDER — shell
   ===================================================================== */
function render(){
  const {parts, q} = parseRoute();
  const v = V();
  const overdue = v.openItems.filter(i=>i.status!=='Done' && i.due && daysUntil(i.due)<0).length;
  const openCount = openOf(v.openItems).length;
  const page = parts[0] || 'dash';

  const nl = (href, key, icon, label, count, hot) =>
    '<a class="navlink'+(page===key?' on':'')+'" href="#'+href+'"><span class="ic">'+icon+'</span>'+
    '<span class="grow truncate">'+label+'</span>'+
    (count!=null && count>0 ? '<span class="cnt'+(hot?' hot':'')+'">'+count+'</span>':'')+'</a>';

  let body = '';
  try{
    switch(page){
      case 'dash':     body = viewDash(); break;
      case 'profiles': body = viewProfiles(); break;
      case 'profile':  body = viewProfile(parts[1], q); break;
      case 'e':        body = viewEntity(parts[1], parts[2], q); break;
      case 'items':    body = viewItems(q); break;
      case 'backups':  body = viewBackups(); break;
      case 'settings': body = viewSettings(); break;
      default:         body = '<div class="empty"><div class="big">🤷</div>Page not found. <a href="#/dash">Go to dashboard</a></div>';
    }
  }catch(err){
    console.error(err);
    body = '<div class="card card-pad"><div class="warnbox"><b>Something went wrong rendering this page.</b><br>'+
           esc(err.message||String(err))+'<br><br>Your data is safe — go to <a href="#/backups">Backups</a> and export it.</div></div>';
  }

  $('#app').innerHTML =
    (S.readOnly ? '<div class="ro-banner">📦 Read-only backup snapshot'+
        (v.__exportedAt ? ' from '+esc(fmtTS(v.__exportedAt)) : '')+
        ' — browse freely; to edit, import this file into the live tracker.</div>' : '')+
    '<header class="topbar">'+
      '<div class="logo">🧭</div><div class="brandname">Partnership Tracker</div>'+
      '<div class="searchwrap"><input id="gsearch" type="search" placeholder="Search profiles, partnerships, partners, notes…" autocomplete="off"><div id="sres"></div></div>'+
      '<div class="grow"></div>'+
      (S.readOnly ? '' : '<div class="savepill" id="saveState"><span class="dot"></span> Saved</div>')+
      (S.readOnly ? '' : '<div class="savepill hidden" id="syncState"></div>')+
      '<button class="btn btn-ghost btn-icon" data-act="theme" title="Light / dark">◐</button>'+
      (S.readOnly
        ? '<button class="btn btn-sm" data-act="dl-json">⬇ JSON</button>'
        : '<button class="btn btn-sm" data-act="lock" title="Lock — you\'ll need your password again">🔒 '+esc(S.user)+'</button>')+
    '</header>'+
    '<div class="shell">'+
      '<nav class="sidebar">'+
        '<div class="navsec">Workspace</div>'+
        nl('/dash','dash','▦','Dashboard')+
        nl('/profiles','profiles','👤','Profiles', v.profiles.length)+
        nl('/items','items','✓','Open Items', openCount, overdue>0)+
        '<div class="navsec">Data</div>'+
        nl('/backups','backups','⛁','Backups & History')+
        nl('/settings','settings','⚙','Settings')+
      '</nav>'+
      '<main class="content">'+body+'</main>'+
    '</div>';

  paintSaveState();
  paintSyncState();
  wireSearch();
}

function viewDash(){
  const v = V();
  const items = openOf(v.openItems);
  const overdue = items.filter(i=>i.due && daysUntil(i.due)<0);
  const soon = items.filter(i=>i.due && daysUntil(i.due)>=0 && daysUntil(i.due)<=7);
  const live = v.b2b.filter(b=>['Active','Onboarded','Verbal / Signed Commitment',
                               'Live — sending cases','MoU / Agreement signed'].includes(b.stage)).length;
  const recent = v.meetings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);

  const stat = (k,val,s,cls,href) =>
    '<div class="stat '+(cls||'')+(href?' link':'')+'"'+(href?' data-nav="'+href+'"':'')+'>'+
    '<div class="k">'+k+'</div><div class="v">'+val+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';

  let html =
    '<div class="page-head"><h1>Dashboard</h1>'+
    '<div class="muted small">'+(v.owner?esc(v.owner)+' · ':'')+fmtDate(todayISO())+'</div></div>'+
    (canEdit() && !SY.token
      ? '<div class="amberbox" style="margin-bottom:18px"><b>Cloud sync is off on this device.</b> '+
        'Anything you add here stays on this device only, and data from your other devices will not appear. '+
        '<button class="btn btn-sm" data-nav="/settings" style="margin-left:8px">Turn on sync</button></div>'
      : '')+
    '<div class="stats">'+
      stat('Profiles', v.profiles.length, 'people being tracked', '', '/profiles')+
      stat('B2B partnerships', v.b2b.length, live+' signed or live', '', '/profiles')+
      stat('Partners', v.partners.length, 'facilitators & others', '', '/profiles')+
      stat('Open items', items.length, 'across everything', items.length?'warn':'good', '/items')+
      stat('Overdue', overdue.length, overdue.length?'need attention now':'nothing late', overdue.length?'hot':'good', '/items?overdue=1')+
      stat('Due in 7 days', soon.length, 'coming up', '', '/items')+
    '</div>';

  if(!v.profiles.length){
    html += '<div class="card"><div class="empty">'+
      '<div class="big">👤</div><h3>Start with a profile</h3>'+
      '<p class="muted" style="max-width:430px;margin:8px auto 16px">A profile is the person whose work you are tracking. '+
      'Inside it you keep their B2B partnerships and their partners.</p>'+
      (canEdit()?'<button class="btn btn-primary" data-act="new-profile">＋ Create first profile</button>':'')+
      '</div></div>';
    return html;
  }

  // open items preview
  html += '<div class="card" style="margin-bottom:18px"><div class="card-head">'+
    '<h2>Open items needing attention</h2>'+
    '<a class="btn btn-sm" href="#/items">View all '+items.length+' →</a></div>';
  const top = overdue.concat(soon).concat(items.filter(i=>!i.due)).slice(0,8);
  if(!top.length) html += '<div class="empty">✓ Nothing open. Clean slate.</div>';
  else html += itemsTable(top, {showParent:true});
  html += '</div>';

  // profiles overview
  html += '<div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Profiles</h2>'+
    (canEdit()?'<button class="btn btn-sm btn-primary" data-act="new-profile">＋ Profile</button>':'')+'</div>'+
    '<div class="tablewrap"><table class="tbl"><thead><tr>'+
    '<th>Name</th><th>Role</th><th>B2B partnerships</th><th>Partners</th><th>Open items</th><th>Last activity</th>'+
    '</tr></thead><tbody>'+
    v.profiles.map(p=>{
      const b = profB2b(p.id).length, pa = profPart(p.id).length;
      const oi = openOf(v.openItems.filter(i=>i.profileId===p.id)).length;
      const la = Math.max(p.updatedAt||0, ...v.meetings.filter(m=>m.profileId===p.id)
                   .map(m=>new Date(m.date+'T00:00:00').getTime()||0), 0);
      return '<tr><td class="namecell"><a href="#/profile/'+p.id+'">'+esc(p.name)+'</a>'+
        (p.org?'<div class="sub">'+esc(p.org)+'</div>':'')+'</td>'+
        '<td>'+esc(p.role||'—')+'</td><td>'+b+'</td><td>'+pa+'</td>'+
        '<td>'+(oi?'<span class="badge b-amber">'+oi+' open</span>':'<span class="dim">—</span>')+'</td>'+
        '<td class="dim small">'+(la?relTime(la):'—')+'</td></tr>';
    }).join('')+

  // recent meetings
  html += '<div class="card"><div class="card-head"><h2>Recent meeting notes</h2></div>';
  if(!recent.length) html += '<div class="empty">No meeting notes logged yet.</div>';
  else html += '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>With</th><th>Subject</th><th>Profile</th></tr></thead><tbody>'+
    recent.map(m=>{

    }).join('')+'</tbody></table></div>';
  html += '</div>';

/* ---------- open items table ---------- */
function itemSort(a,b){
  if((a.status==='Done') !== (b.status==='Done')) return a.status==='Done' ? 1 : -1;
  const ad = a.due ? daysUntil(a.due) : 99999, bd = b.due ? daysUntil(b.due) : 99999;
  if(ad !== bd) return ad - bd;
  const pr = {High:0, Medium:1, Low:2};
  return (pr[a.priority] ?? 3) - (pr[b.priority] ?? 3);
}
function itemsTable(rows, opt){
  opt = opt || {};
  return '<div class="tablewrap"><table class="tbl"><thead><tr>'+
    '<th></th><th>Item</th>'+(opt.showParent?'<th>Against</th>':'')+
    '<th>Owner</th><th>'+(opt.closed?'Closed':'Due')+'</th><th>Priority</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+
    rows.map(i=>{
      const done = i.status==='Done';
      return '<tr'+(done?' class="done-row"':'')+'>'+
        '<td style="width:1%">'+(canEdit()
          ? '<input type="checkbox" data-act="toggle-item" data-id="'+i.id+'"'+(done?' checked':'')+
            ' style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer" title="Mark done / not done">'
          : (done?'✓':''))+'</td>'+
        '<td class="namecell">'+esc(i.title)+
          (i.notes?'<div class="sub">'+esc(i.notes.length>110?i.notes.slice(0,110)+'…':i.notes)+'</div>':'')+'</td>'+
        (opt.showParent
          ? '<td class="small">'+(i.parentId
              ? '<a href="#/e/'+i.parentType+'/'+i.parentId+'?tab=items">'+esc(entName(i.parentType,i.parentId))+'</a>'+
                '<div class="sub">'+esc(ENT_LABEL[i.parentType]||'')+'</div>'
              : '<span class="dim">—</span>')+'</td>'
          : '')+
        '<td class="small">'+esc(i.owner||'—')+'</td>'+
        '<td class="nowrap small">'+(opt.closed
          ? (i.closedAt ? esc(fmtTS(i.closedAt).split(',')[0]) + '<div class="sub">'+esc(relTime(i.closedAt))+'</div>'
                        : '<span class="dim">—</span>')
          : dueCell(i))+'</td>'+
        '<td>'+prioBadge(i.priority)+'</td>'+
        '<td>'+itemBadge(i.status)+'</td>'+
        '<td class="acts">'+(canEdit()?
          (opt.closed?'<button class="btn btn-ghost btn-sm" data-act="reopen-item" data-id="'+i.id+'">↺ Reopen</button>':'')+
          '<button class="btn btn-ghost btn-sm" data-act="edit-item" data-id="'+i.id+'">Edit</button>'+
          '<button class="btn btn-ghost btn-sm" data-act="del-item" data-id="'+i.id+'" title="Delete">🗑</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* =====================================================================
   VIEW — Open items (top-level tab)
   ===================================================================== */
function viewItems(q){
  const v = V();
  const view     = q.get('view')    || 'open';
  const closed   = view === 'closed';
  const fProfile = q.get('profile') || '';
  const fStatus  = q.get('status')  || '';
  const fPrio    = q.get('prio')    || '';
  const fOwner   = q.get('owner')   || '';
  const overdueOnly = q.get('overdue')==='1';

  let rows = v.openItems.filter(i => closed ? i.status==='Done' : i.status!=='Done');
  if(fProfile) rows = rows.filter(i=>i.profileId===fProfile);
  if(!closed && fStatus) rows = rows.filter(i=>i.status===fStatus);
  if(fPrio) rows = rows.filter(i=>i.priority===fPrio);
  if(fOwner) rows = rows.filter(i=>(i.owner||'').toLowerCase().includes(fOwner.toLowerCase()));
  if(!closed && overdueOnly) rows = rows.filter(i=>i.due && daysUntil(i.due)<0);
  if(closed) rows.sort((a,b)=>(b.closedAt||b.updatedAt||0)-(a.closedAt||a.updatedAt||0));
  else rows.sort(itemSort);

  const all = v.openItems;
  const openN = openOf(all).length;
  const overN = all.filter(i=>i.status!=='Done' && i.due && daysUntil(i.due)<0).length;

  const opt = (val,label,cur) => '<option value="'+esc(val)+'"'+(String(cur)===String(val)?' selected':'')+'>'+esc(label)+'</option>';

  const closedN = all.filter(i=>i.status==='Done').length;

  let html = '<div class="page-head spread"><div><h1>'+(closed?'Closed Items':'Open Items')+'</h1>'+
    '<div class="muted small">'+(closed
      ? closedN+' item'+(closedN===1?'':'s')+' closed. Reopen any of them if they come back.'
      : 'Everything outstanding across every profile, partnership and partner — '+
        openN+' open'+(overN?', <b class="due-over">'+overN+' overdue</b>':'')+'.')+'</div></div>'+
    (canEdit()?'<button class="btn btn-primary" data-act="new-item-any">＋ New item</button>':'')+'</div>';

  html += '<div class="tabs">'+
    '<button class="tab'+(closed?'':' on')+'" data-itemview="open">✓ Open <span class="cnt">'+openN+'</span></button>'+
    '<button class="tab'+(closed?' on':'')+'" data-itemview="closed">✔ Closed <span class="cnt">'+closedN+'</span></button>'+
    '</div>';

  html += '<div class="filters">'+
    '<select class="inp" data-filter="profile">'+opt('','All profiles',fProfile)+
      v.profiles.map(p=>opt(p.id,p.name,fProfile)).join('')+'</select>'+
    (closed?'':'<select class="inp" data-filter="status">'+
      opt('','Any open status',fStatus)+
      v.globals.itemStatuses.filter(x=>x!=='Done').map(s=>opt(s,s,fStatus)).join('')+'</select>')+
    '<select class="inp" data-filter="prio">'+opt('','Any priority',fPrio)+
      v.globals.priorities.map(s=>opt(s,s,fPrio)).join('')+'</select>'+
    '<input class="inp" data-filter="owner" type="search" placeholder="Owner contains…" value="'+esc(fOwner)+'">'+
    (closed?'':'<label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" data-filter="overdue"'+(overdueOnly?' checked':'')+
      ' style="width:15px;height:15px;accent-color:var(--accent)"> Overdue only</label>')+
    '<button class="btn btn-sm btn-ghost" data-act="clear-filters">Clear</button>'+
    '</div>';

  html += '<div class="card">'+
    (rows.length
      ? itemsTable(rows, {showParent:true, closed:closed})
      : '<div class="empty"><div class="big">'+(closed?'✔':'✓')+'</div>'+
        (closed ? 'Nothing closed yet. Items you tick off land here.'
                : 'Nothing open. Everything is either closed or not raised yet.')+'</div>')+
    '</div>';
  return html;
}
